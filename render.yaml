databases:
  - name: elms-db
    databaseName: ELMS_DB
    user: elms_user
    plan: free

services:
  - type: web
    name: elms-api
    runtime: dotnet
    plan: free
    buildCommand: "dotnet publish backend/ELMS.API/ELMS.API/ELMS.API.csproj -c Release -o out"
    startCommand: "dotnet out/ELMS.API.dll"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: elms-db
          property: connectionString
      - key: JWT_KEY
        generateValue: true
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
    healthCheckPath: /swagger
